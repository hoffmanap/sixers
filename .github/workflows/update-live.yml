name: Update live tracker

on:
  # The daily schedule is switched off: stats.nba.com blocks GitHub's servers (every run timed out).
  # Use run_update.bat on your own computer instead. To retry GitHub, restore this block:
  #   schedule:
  #     - cron: "0 11 * * *"
  workflow_dispatch:        # manual run from the Actions tab only

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nba_api pandas
      - name: Pull data and rebuild live_data.json
        # If stats.nba.com blocks GitHub's servers this step fails and nothing is committed.
        # In that case disable this workflow and use run_update.bat on your own computer.
        run: python update_live.py
      - name: Commit if changed
        run: |
          git config user.name "live-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/live_data.json
          git diff --cached --quiet || (git commit -m "Update live tracker data" && git push)
