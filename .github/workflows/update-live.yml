name: Update live tracker

on:
  schedule:
    - cron: "0 11 * * *"   # daily, 11:00 UTC (after the previous night's games are posted)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nba_api pandas
      - name: Pull data and rebuild live_data.json
        # If stats.nba.com blocks GitHub's servers this step fails and nothing is committed.
        # In that case disable this workflow and use run_update.bat on your own computer.
        run: python update_live.py
      - name: Commit if changed
        run: |
          git config user.name "live-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/live_data.json
          git diff --cached --quiet || (git commit -m "Update live tracker data" && git push)
